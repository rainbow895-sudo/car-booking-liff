<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>借車系統</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root {
      --primary: #718da3;
      --primary-dark: #58758c;
      --primary-light: #e6edf1;
      --sidebar: #5d788b;
      --bg: #f3f5f6;
      --card: #ffffff;
      --text: #3f4f5a;
      --muted: #7d8991;
      --border: #d9e0e4;
      --success: #789989;
      --warning: #b3986d;
      --danger: #aa7777;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        Arial,
        sans-serif;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    img {
      max-width: 100%;
    }

    code {
      padding: 2px 5px;
      border-radius: 4px;
      background: rgba(0, 0, 0, .06);
    }

    .hidden {
      display: none !important;
    }

    /* ---------- 頂部 ---------- */

    .topbar {
      height: 68px;
      padding: 0 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      color: var(--text);
      font-size: 20px;
      font-weight: 800;
    }

    .brand-logo {
      width: 46px;
      height: 46px;
      object-fit: contain;
      border-radius: 50%;
      background: #fff;
    }

    .user-area {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 14px;
    }

    /* ---------- 版面 ---------- */

    .layout {
      display: flex;
      min-height: calc(100vh - 68px);
    }

    .sidebar {
      width: 235px;
      flex-shrink: 0;
      padding: 22px 14px;
      background: var(--sidebar);
    }

    .sidebar-label {
      margin: 8px 12px 10px;
      color: #d9e3e9;
      font-size: 12px;
      font-weight: 700;
    }

    .nav-button {
      width: 100%;
      padding: 12px 13px;
      margin-bottom: 5px;
      border: 0;
      border-radius: 8px;
      color: #eef3f6;
      background: transparent;
      text-align: left;
      font-weight: 600;
    }

    .nav-button:hover,
    .nav-button.active {
      background: rgba(255, 255, 255, .2);
    }

    .main {
      width: 100%;
      max-width: 1500px;
      margin: 0 auto;
      padding: 30px;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 18px;
      margin-bottom: 22px;
    }

    .page-title {
      margin: 0;
      font-size: 28px;
    }

    .page-subtitle {
      margin-top: 6px;
      color: var(--muted);
      line-height: 1.6;
    }

    /* ---------- 卡片與表單 ---------- */

    .card {
      padding: 23px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--card);
      box-shadow: 0 6px 20px rgba(65, 82, 95, .05);
    }

    .card + .card {
      margin-top: 18px;
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    .grid-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .grid-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .grid-4 {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 700;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cfd9de;
      border-radius: 8px;
      color: var(--text);
      background: #fff;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: 3px solid rgba(113, 141, 163, .2);
      border-color: var(--primary);
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }
    
    .form-field-compact {
  margin-top: 16px;
}

.form-field-compact input {
  min-height: 44px;
}

.plate-section {
  margin-top: 18px;
}

.plate-section .page-subtitle {
  margin-top: 6px;
  line-height: 1.6;
}

    .button {
      padding: 10px 16px;
      border: 0;
      border-radius: 8px;
      font-weight: 700;
      transition: .15s;
    }

    .button:hover {
      transform: translateY(-1px);
    }

    .button-primary {
      color: #fff;
      background: var(--primary);
    }

    .button-primary:hover {
      background: var(--primary-dark);
    }

    .button-secondary {
      color: #53636d;
      background: #e7edef;
    }

    .button-light {
      color: var(--primary-dark);
      background: var(--primary-light);
    }

    .button-success {
      color: #fff;
      background: var(--success);
    }

    .button-danger {
      color: #fff;
      background: var(--danger);
    }

    /* ---------- 訊息 ---------- */

    .notice {
      margin: 14px 0;
      padding: 12px 14px;
      border-radius: 9px;
      line-height: 1.65;
      font-size: 14px;
    }

    .notice-info {
      color: #496779;
      background: #eaf1f4;
    }

    .notice-warning {
      color: #826d4c;
      background: #f6f0e4;
    }

    .notice-success {
      color: #52735e;
      background: #eaf2ed;
    }

    .notice-danger {
      color: #8e5d5d;
      background: #f5eaea;
    }

    /* ---------- 注意事項 ---------- */

    .notice-card {
      margin-top: 18px;
    }

    .notice-card h3 {
      margin-top: 0;
      color: var(--primary-dark);
    }

    .notice-list {
      margin: 0;
      padding-left: 23px;
    }

    .notice-list li {
      margin: 7px 0;
      line-height: 1.7;
    }

    .notice-empty {
      margin: 0;
    }

    /* ---------- 狀態 ---------- */

    .status {
      display: inline-flex;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
    }

    .status-wait {
      color: #806844;
      background: #f4ead8;
    }

    .status-assigned {
      color: #506f85;
      background: #e2edf2;
    }

    .status-done {
      color: #52735e;
      background: #e3efe7;
    }

    .status-cancelled {
      color: #8c5d5d;
      background: #f3e4e4;
    }

    .empty {
      padding: 34px 10px;
      color: var(--muted);
      text-align: center;
    }

    /* ---------- 首頁 ---------- */

    .hero {
      max-width: 680px;
      margin: 7vh auto;
      padding: 0 15px;
      text-align: center;
    }

    .hero-logo {
      width: 165px;
      height: 165px;
      margin: 0 auto 20px;
    }

    .hero-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .hero h1 {
      margin: 8px 0;
      font-size: 42px;
    }

    .hero p {
      color: var(--muted);
      line-height: 1.8;
    }

    .hero-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }

    .hero-actions .button {
      min-width: 190px;
      padding: 14px 20px;
    }

    /* ---------- 統計 ---------- */

    .stat-card {
      padding: 19px;
    }

    .stat-label {
      color: var(--muted);
      font-size: 14px;
    }

    .stat-value {
      margin-top: 7px;
      color: var(--primary-dark);
      font-size: 32px;
      font-weight: 800;
    }

    /* ---------- 表格 ---------- */

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 760px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 13px 12px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      white-space: nowrap;
      font-size: 14px;
    }

    th {
      color: #596b76;
      background: #f5f8f9;
      font-weight: 800;
    }

    /* ---------- 借車卡片 ---------- */

    .record-card {
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: #fff;
    }

    .record-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .record-title {
      font-size: 17px;
      font-weight: 800;
    }

    .record-info {
      margin-top: 6px;
      color: var(--muted);
      line-height: 1.75;
      font-size: 14px;
    }

    .record-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .mobile-records {
      display: none;
    }

    .guest-badge {
      padding: 5px 9px;
      border-radius: 999px;
      color: #806844;
      background: #f4ead8;
      font-size: 12px;
      font-weight: 700;
    }

    .mobile-nav {
      display: none;
    }

    /* ---------- 響應式 ---------- */

    @media (max-width: 950px) {
      .grid-4 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 700px) {
      .topbar {
        height: 62px;
        padding: 0 14px;
      }

      .brand {
        font-size: 17px;
      }

      .brand-logo {
        width: 38px;
        height: 38px;
      }

      .user-area span {
        display: none;
      }

      .sidebar {
        display: none;
      }

      .layout {
        display: block;
        min-height: auto;
      }

      .main {
        padding: 20px 14px 88px;
      }

      .page-title {
        font-size: 24px;
      }

      .page-header {
        display: block;
      }

      .grid-2,
      .grid-3,
      .grid-4 {
        grid-template-columns: 1fr;
      }

      .hero {
        margin: 7vh auto;
      }

      .hero-logo {
        width: 135px;
        height: 135px;
      }

      .hero h1 {
        font-size: 32px;
      }

      .hero-actions {
        flex-direction: column;
      }

      .hero-actions .button {
        width: 100%;
      }

      .form-actions {
        flex-direction: column-reverse;
      }

      .form-actions .button {
        width: 100%;
      }

      .mobile-nav {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 30;
        display: flex;
        justify-content: space-around;
        height: 64px;
        padding: 6px;
        border-top: 1px solid var(--border);
        background: #fff;
      }

      .mobile-nav button {
        padding: 5px 11px;
        border: 0;
        color: var(--muted);
        background: transparent;
        font-size: 12px;
      }

      .mobile-nav button.active {
        color: var(--primary-dark);
        font-weight: 800;
      }

      .table-wrapper {
        display: none;
      }

      .mobile-records {
        display: block;
      }

      .record-top {
        display: block;
      }
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script>
    /*
     * =========================================================
     * 系統設定
     * =========================================================
     */

    const CONFIG = {
      /*
       * 預覽時保持 true。
       * 正式串接 GAS 時改成 false。
       */
      PREVIEW_MODE: true,

      GAS_URL:
        "https://script.google.com/macros/s/AKfycbwz1QAtyd7k9ErQZr1ICx6xS-4ieeulPmKOtEf4w4uUE8CyKAtQCbhD5BXP4YzVoKWl/exec",

      LIFF_ID: "2007826582-3tKuGAUu"
    };

    /*
     * =========================================================
     * 預覽資料
     * =========================================================
     */

    const MOCK_RECORDS = [
      {
        borrowId: "BR-20260520103000123",
        date: "2026-05-20",
        startTime: "09:00",
        endTime: "17:00",
        employeeNo: "A001",
        driver: "王小明",
        department: "業務部",
        passengers: 3,
        reason: "客戶拜訪",
        location: "台中",
        plate: "ABC-1234",
        mileage: "",
        mileageTime: "",
        status: "已派車",
        note: "管理員指派車牌",
        lineId: "U_DEMO_001"
      },
      {
        borrowId: "BR-20260521110000456",
        date: "2026-05-21",
        startTime: "13:00",
        endTime: "15:00",
        employeeNo: "A002",
        driver: "李小華",
        department: "工程部",
        passengers: 2,
        reason: "設備檢查",
        location: "新竹",
        plate: "",
        mileage: "",
        mileageTime: "",
        status: "待派車",
        note: "",
        lineId: "U_DEMO_002"
      },
      {
        borrowId: "BR-20260522143000789",
        date: "2026-05-22",
        startTime: "14:30",
        endTime: "18:00",
        employeeNo: "A003",
        driver: "陳小美",
        department: "採購部",
        passengers: 1,
        reason: "供應商拜訪",
        location: "桃園",
        plate: "XYZ-7788",
        mileage: "8890",
        mileageTime: "2026-05-22 18:20",
        status: "已回報",
        note: "自行輸入車牌",
        lineId: "U_DEMO_003"
      }
    ];

    const DEFAULT_NOTICES = [
      "借車前請確認借用日期、時間及地點。",
      "用車完成後，請回報回程里程。"
    ];

    const PREVIEW_NOTICES = [
      "借車前請確認借用日期、時間及地點。",
      "請依實際需求填寫借車資料。",
      "用車完成後，請回報回程里程。",
      "如有問題，請聯絡管理員。"
    ];

    const state = {
      mode: "guest",
      user: null,
      page: "home",
      records: [...MOCK_RECORDS],
      searchResult: [],
      selectedRecord: null,
      notices: []
    };

    /*
     * =========================================================
     * 基本工具
     * =========================================================
     */

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function getLocalDateString() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }

    function getRequestedPage() {
      const params = new URLSearchParams(location.search);
      const page = params.get("page");

      const allowedPages = [
        "home",
        "apply",
        "search",
        "mine"
      ];

      return allowedPages.includes(page) ? page : null;
    }

    function isWithinThirtyMinutes(date, time) {
      const start = new Date(`${date}T${time}:00`);
      const diff = start.getTime() - Date.now();

      return diff <= 30 * 60 * 1000 &&
             diff >= -24 * 60 * 60 * 1000;
    }

    function generateBorrowId() {
      const now = new Date();
      const pad = value => String(value).padStart(2, "0");
      const ms = String(now.getMilliseconds()).padStart(3, "0");

      return "BR-" +
        now.getFullYear() +
        pad(now.getMonth() + 1) +
        pad(now.getDate()) +
        pad(now.getHours()) +
        pad(now.getMinutes()) +
        pad(now.getSeconds()) +
        ms;
    }

    function statusHtml(status) {
      const classes = {
        "待派車": "status-wait",
        "已派車": "status-assigned",
        "已回報": "status-done",
        "已取消": "status-cancelled"
      };

      return `
        <span class="status ${classes[status] || ""}">
          ${escapeHtml(status)}
        </span>
      `;
    }

    function showMessage(message, type = "info") {
      const box = document.getElementById("global-message");

      if (!box) {
        alert(message);
        return;
      }

      box.className = `notice notice-${type}`;
      box.textContent = message;
      box.classList.remove("hidden");

      setTimeout(() => {
        box.classList.add("hidden");
      }, 4500);
    }

    /*
     * =========================================================
     * API
     * =========================================================
     */

    async function apiRequest(action, payload = {}) {
      if (CONFIG.PREVIEW_MODE) {
        return mockApi(action, payload);
      }

      const response = await fetch(CONFIG.GAS_URL, {
        method: "POST",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify({
          action,
          ...payload
        })
      });

      const result = await response.json();

      if (!result.ok) {
        throw new Error(result.message || "系統處理失敗");
      }

      return result;
    }

    async function mockApi(action, payload) {
      await new Promise(resolve => setTimeout(resolve, 250));

      if (action === "getNotices") {
        return {
          ok: true,
          notices: [...PREVIEW_NOTICES]
        };
      }

      if (action === "queryRecords") {
        let records = [...state.records];

        if (payload.dateFrom) {
          records = records.filter(
            record => record.date >= payload.dateFrom
          );
        }

        if (payload.dateTo) {
          records = records.filter(
            record => record.date <= payload.dateTo
          );
        }

        return {
          ok: true,
          records
        };
      }

      if (action === "createBorrow") {
        const record = {
          ...payload,
          borrowId: generateBorrowId(),
          status: payload.plate ? "已派車" : "待派車",
          mileage: "",
          mileageTime: "",
          note: payload.plate
            ? "自行輸入車牌"
            : "",
          lineId: state.user?.lineId || ""
        };

        state.records.unshift(record);

        return {
          ok: true,
          message: "借車申請已送出",
          record
        };
      }

      if (action === "assignPlate") {
        const record = state.records.find(
          item => item.borrowId === payload.borrowId
        );

        if (!record) {
          throw new Error("找不到借車申請");
        }

        record.plate = payload.plate;
        record.status = "已派車";
        record.note = "管理員指派車牌";

        return {
          ok: true,
          message: "已完成派車",
          record
        };
      }

      if (action === "reportMileage") {
        const record = state.records.find(
          item => item.borrowId === payload.borrowId
        );

        if (!record) {
          throw new Error("找不到借車申請");
        }

        record.mileage = payload.mileage;
        record.mileageTime = new Date()
          .toLocaleString("zh-TW", { hour12: false })
          .replaceAll("/", "-");

        record.status = "已回報";

        return {
          ok: true,
          message: "回程里程已回報",
          record
        };
      }

      throw new Error("預覽模式尚未支援此操作");
    }

    /*
     * =========================================================
     * 注意事項
     * =========================================================
     *
     * 正式模式：
     * 呼叫 GAS 的 getNotices action。
     *
     * GAS 預期回傳：
     * {
     *   "ok": true,
     *   "notices": [
     *     "第一項注意事項",
     *     "第二項注意事項"
     *   ]
     * }
     */

    async function loadNotices() {
      try {
        const result = await apiRequest("getNotices");

        if (Array.isArray(result.notices)) {
          state.notices = result.notices
            .map(item => String(item).trim())
            .filter(item => item !== "");
        }

        if (!state.notices.length) {
          state.notices = [...DEFAULT_NOTICES];
        }
      } catch (error) {
        console.warn("讀取注意事項失敗：", error);
        state.notices = [...DEFAULT_NOTICES];
      }
    }

    function noticesHtml() {
      if (!state.notices.length) {
        return `
          <p class="notice-empty">目前沒有注意事項。</p>
        `;
      }

      return `
        <ul class="notice-list">
          ${state.notices.map(item => `
            <li>${escapeHtml(item)}</li>
          `).join("")}
        </ul>
      `;
    }

    /*
     * =========================================================
     * 身份與 LIFF
     * =========================================================
     */

    function isLoggedIn() {
      return state.mode === "user" || state.mode === "admin";
    }

    function isAdmin() {
      return state.mode === "admin";
    }

    function enterGuestMode() {
      state.mode = "guest";
      state.user = null;
      state.page = "search";
      render();
    }

    function enterPreviewUser() {
      state.mode = "user";
      state.user = {
        name: "王小明",
        employeeNo: "A001",
        department: "業務部",
        lineId: "U_DEMO_001"
      };

      state.page = getRequestedPage() || "dashboard";
      render();
    }

    function enterPreviewAdmin() {
      state.mode = "admin";
      state.user = {
        name: "系統管理員",
        employeeNo: "ADMIN",
        department: "管理部",
        lineId: "U_ADMIN_DEMO"
      };

      state.page = "admin";
      render();
    }

    async function loginWithLine() {
      if (CONFIG.PREVIEW_MODE) {
        enterPreviewUser();
        showMessage("預覽模式：已模擬一般使用者登入", "success");
        return;
      }

      try {
        await liff.init({
          liffId: CONFIG.LIFF_ID
        });

        if (!liff.isLoggedIn()) {
          liff.login({
            redirectUri: window.location.href
          });
          return;
        }

        const profile = await liff.getProfile();

        state.mode = "user";
        state.user = {
          name: profile.displayName,
          lineId: profile.userId
        };

        state.page = getRequestedPage() || "dashboard";
        render();
      } catch (error) {
        showMessage(error.message || "LINE 登入失敗", "danger");
      }
    }

    async function initLiffEntry() {
      if (CONFIG.PREVIEW_MODE) {
        initPreviewRoute();
        return;
      }

      try {
        if (typeof liff === "undefined") {
          render();
          return;
        }

        await liff.init({
          liffId: CONFIG.LIFF_ID
        });

        if (!liff.isLoggedIn()) {
          liff.login({
            redirectUri: window.location.href
          });
          return;
        }

        const profile = await liff.getProfile();

        state.mode = "user";
        state.user = {
          name: profile.displayName,
          lineId: profile.userId
        };

        /*
         * LINE 按鈕：
         * https://liff.line.me/2007826582-3tKuGAUu?page=apply
         *
         * 登入後會直接進入借車申請頁。
         */
        state.page = getRequestedPage() || "dashboard";
        render();
      } catch (error) {
        document.getElementById("app").innerHTML = `
          <div class="notice notice-danger" style="margin:20px;">
            LINE 登入失敗：
            ${escapeHtml(error.message)}
          </div>
        `;
      }
    }

      if (

        typeof liff !== "undefined" &&

      state.mode = "guest";

    function updatePlateRule() {
      const date = document.getElementById("f-date")?.value;
      const time = document.getElementById("f-startTime")?.value;
      const hint = document.getElementById("plate-hint");
      const plate = document.getElementById("f-plate");

      if (!date || !time || !hint || !plate) {
        return;
      }

      if (isWithinThirtyMinutes(date, time)) {
        hint.textContent =
          "距離開始時間 30 分鐘內，可輸入車牌，也可以留白；留白時由管理員指派。";
      } else {
        plate.value = "";
        hint.textContent =
          "目前超過 30 分鐘，車牌將由管理員安排。";
      }
    }

    async function submitBorrow(event) {
      event.preventDefault();

      const date = document.getElementById("f-date").value;
      const startTime = document.getElementById("f-startTime").value;
      const endTime = document.getElementById("f-endTime").value;

      if (endTime <= startTime) {
        showMessage("結束時間必須晚於開始時間", "danger");
        return;
      }

      const canInputPlate = isWithinThirtyMinutes(date, startTime);

      const plate = canInputPlate
        ? document.getElementById("f-plate").value.trim()
        : "";

      const payload = {
        employeeNo:
          document.getElementById("f-employeeNo").value.trim(),

        driver:
          document.getElementById("f-driver").value.trim(),

        department:
          document.getElementById("f-department").value.trim(),

        date,
        startTime,
        endTime,

        passengers: Number(
          document.getElementById("f-passengers").value
        ),

        reason:
          document.getElementById("f-reason").value.trim(),

        location:
          document.getElementById("f-location").value.trim(),

        plate
      };

      try {
        const result = await apiRequest("createBorrow", payload);

        state.selectedRecord = result.record;
        state.page = "mine";
        render();

        showMessage(
          `${result.message}，申請編號：${result.record.borrowId}`,
          "success"
        );
      } catch (error) {
        showMessage(error.message, "danger");
      }
    }

    async function submitSearch(event) {
      event.preventDefault();

      const dateFrom =
        document.getElementById("q-dateFrom").value;

      const dateTo =
        document.getElementById("q-dateTo").value;

      if (!dateFrom || !dateTo) {
        showMessage("請選擇日期起訖", "danger");
        return;
      }

      if (dateFrom > dateTo) {
        showMessage("日期起不能晚於日期迄", "danger");
        return;
      }

      try {
        const result = await apiRequest("queryRecords", {
          dateFrom,
          dateTo
        });

        state.searchResult = result.records;
        renderSearchResults(result.records);
      } catch (error) {
        showMessage(error.message, "danger");
      }
    }

    function clearSearch() {
      const today = getLocalDateString();

      const dateFrom =
        document.getElementById("q-dateFrom");

      const dateTo =
        document.getElementById("q-dateTo");

      const resultBox =
        document.getElementById("search-results");

      const countBox =
        document.getElementById("result-count");

      if (dateFrom) {
        dateFrom.value = today;
      }

      if (dateTo) {
        dateTo.value = today;
      }

      if (countBox) {
        countBox.textContent = "";
      }

      if (resultBox) {
        resultBox.innerHTML =
          `<div class="empty">請選擇日期區間後開始查詢。</div>`;
      }

      state.searchResult = [];
    }

    function renderSearchResults(records) {
      const resultBox =
        document.getElementById("search-results");

      const countBox =
        document.getElementById("result-count");

      if (!resultBox) {
        return;
      }

      if (countBox) {
        countBox.textContent = `共 ${records.length} 筆`;
      }

      if (!records.length) {
        resultBox.innerHTML =
          `<div class="empty">查無借車紀錄。</div>`;
        return;
      }

      resultBox.innerHTML = `
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>日期</th>
                <th>駕駛人</th>
                <th>部門</th>
                <th>時間</th>
                <th>地點</th>
                <th>車牌</th>
                <th>狀態</th>
                <th>操作</th>
              </tr>
            </thead>

            <tbody>
              ${records.map(record => `
                <tr>
                  <td>${escapeHtml(record.date)}</td>
                  <td>${escapeHtml(record.driver)}</td>
                  <td>${escapeHtml(record.department)}</td>
                  <td>
                    ${escapeHtml(record.startTime)}
                    ～${escapeHtml(record.endTime)}
                  </td>
                  <td>${escapeHtml(record.location)}</td>
                  <td>${escapeHtml(record.plate || "尚未指派")}</td>
                  <td>${statusHtml(record.status)}</td>
                  <td>
                    <button
                      class="button button-light"
                      onclick="viewRecord('${escapeHtml(record.borrowId)}')">
                      查看
                    </button>
                  </td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>

        <div class="mobile-records">
          ${records.map(recordCard).join("")}
        </div>
      `;
    }

    function viewRecord(borrowId) {
      const record =
        state.records.find(item => item.borrowId === borrowId) ||
        state.searchResult.find(item => item.borrowId === borrowId);

      state.selectedRecord = record;
      state.page = "detail";
      render();
    }

    async function assignPlate(borrowId) {
      const plate = prompt("請輸入要指派的車牌號碼：");

      if (!plate || !plate.trim()) {
        return;
      }

      try {
        const result = await apiRequest("assignPlate", {
          borrowId,
          plate: plate.trim()
        });

        render();
        showMessage(result.message, "success");
      } catch (error) {
        showMessage(error.message, "danger");
      }
    }

    async function reportMileage(borrowId) {
      const mileage = prompt("請輸入回程里程數：");

      if (!mileage || !mileage.trim()) {
        return;
      }

      if (!/^[0-9]+(?:\.[0-9]+)?$/.test(mileage.trim())) {
        showMessage("里程數必須是數字", "danger");
        return;
      }

      try {
        const result = await apiRequest("reportMileage", {
          borrowId,
          mileage: mileage.trim()
        });

        state.selectedRecord = result.record;
        render();
        showMessage(result.message, "success");
      } catch (error) {
        showMessage(error.message, "danger");
      }
    }

    /*
     * =========================================================
     * 渲染
     * =========================================================
     */

    function render() {
      let content;

      switch (state.page) {
        case "dashboard":
          content = dashboardPage();
          break;

        case "apply":
          content = applyPage();
          break;

        case "search":
          content = searchPage();
          break;

        case "mine":
          content = minePage();
          break;

        case "admin":
          content = isAdmin() ? adminPage() : dashboardPage();
          break;

        case "records":
          content = isAdmin() ? recordsPage() : dashboardPage();
          break;

        case "detail":
          content = detailPage(state.selectedRecord);
          break;

        case "home":
        default:
          content = homePage();
      }

      document.getElementById("app").innerHTML =
        shell(content);

      if (state.page === "apply") {
        setTimeout(updatePlateRule, 0);
      }
    }

    function initPreviewRoute() {
      const params =
        new URLSearchParams(window.location.search);

      const preview = params.get("preview");

      if (preview === "admin") {
        enterPreviewAdmin();
        return;
      }

      if (preview === "user") {
        enterPreviewUser();
        return;
      }

      if (preview === "guest") {
        enterGuestMode();
        return;
      }

      /*
       * 預覽 page=apply：
       * index.html?page=apply
       */
      if (getRequestedPage() === "apply") {
        enterPreviewUser();
        return;
      }

      render();
    }

    /*
     * =========================================================
     * 啟動
     * =========================================================
     */

    async function startApp() {
      /*
       * 注意事項先讀取完成，
       * 再初始化 LIFF 或顯示首頁。
       */
      await loadNotices();
      await initLiffEntry();
    }

    startApp();
  </script>
</body>
</html>
