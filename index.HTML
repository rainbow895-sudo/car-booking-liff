<script>
// ==========================================
// 設定區
// ==========================================
const LIFF_ID = '2007826582-3tKuGAUu';

const GAS_URL =
  'https://script.google.com/macros/s/AKfycbwz1QAtyd7k9ErQZr1ICx6xS-4ieeulPmKOtEf4w4uUE8CyKAtQCbhD5BXP4YzVoKWl/exec';

const LINE_LOGIN_CHANNEL_ID =
  '2007826766';

const LINE_LOGIN_REDIRECT_URI =
  GAS_URL;

// ==========================================
// 全域變數
// ==========================================
let pax = 1;
let currentStep = 1;
let userId = '';
let liffReady = false;

// ==========================================
// 產生每位使用者專屬的 localStorage Key
// ==========================================
function getUserPrefsKey() {
  if (userId) {
    return 'car_user_prefs_' + userId;
  }

  return 'car_user_prefs';
}

// ==========================================
// 將資料填入表單
// ==========================================
function applySavedUserData(saved) {
  if (!saved) return;

  const empIdInput = document.getElementById('emp-id');
  const driverInput = document.getElementById('driver');
  const deptInput = document.getElementById('dept');

  if (saved.empId && empIdInput && !empIdInput.value) {
    empIdInput.value = saved.empId;
  }

  if (saved.driver && driverInput && !driverInput.value) {
    driverInput.value = saved.driver;
  }

  if (saved.dept && deptInput && !deptInput.value) {
    deptInput.value = saved.dept;
  }
}

// ==========================================
// 頁面一開啟時，先載入一般暫存資料
// 即使 LIFF 還沒有完成，也可以先帶入工號、姓名、部門
// ==========================================
function loadGeneralSavedUserData() {
  try {
    const saved = JSON.parse(
      localStorage.getItem('car_user_prefs') || '{}'
    );

    applySavedUserData(saved);

  } catch (error) {
    console.error('載入一般暫存資料失敗:', error);
  }
}

// ==========================================
// 取得 LINE ID 後，載入該 LINE 使用者專屬資料
// ==========================================
function loadLineUserData() {
  if (!userId) return;

  try {
    const key = getUserPrefsKey();
    const saved = JSON.parse(
      localStorage.getItem(key) || '{}'
    );

    applySavedUserData(saved);

  } catch (error) {
    console.error('載入 LINE 使用者資料失敗:', error);
  }
}

// ==========================================
// 儲存工號、姓名、部門
// 同時儲存一般資料及 LINE 專屬資料
// ==========================================
function saveUserData() {
  const data = {
    empId: document.getElementById('emp-id').value.trim(),
    driver: document.getElementById('driver').value.trim(),
    dept: document.getElementById('dept').value.trim()
  };

  try {
    // 一般資料：LIFF 尚未取得 LINE ID 時，下次仍可先帶入
    localStorage.setItem(
      'car_user_prefs',
      JSON.stringify(data)
    );

    // LINE 專屬資料：避免不同使用者共用同一組資料
    if (userId) {
      localStorage.setItem(
        'car_user_prefs_' + userId,
        JSON.stringify(data)
      );
    }

  } catch (error) {
    console.error('儲存使用者資料失敗:', error);
  }
}

// ==========================================
// 判斷 LINE userId 是否有效
// 正常 LINE userId 會以 U 開頭，後面為英數字
// ==========================================
function isValidLineUserId(id) {
  return typeof id === 'string' &&
    /^U[0-9a-z]+$/i.test(id) &&
    id !== 'U_test_preview';
}

// ==========================================
// 初始化 LIFF
// ==========================================
async function initLiff() {
  // 先載入暫存資料
  // 這樣即使 LIFF 尚未登入，工號、姓名、部門仍可先自動填入
  loadGeneralSavedUserData();

  try {
    console.log('開始初始化 LIFF');

    await liff.init({
      liffId: LIFF_ID
    });

    console.log('LIFF 初始化完成');
    console.log('是否在 LINE App 內:', liff.isInClient());
    console.log('目前是否已登入:', liff.isLoggedIn());

    // 尚未登入時，導向 LINE Login
    // 一定要 return，避免尚未登入完成就執行 getProfile()
    if (!liff.isLoggedIn()) {
      console.log('尚未登入，開始 LINE Login');
      liff.login();
      return;
    }

    // 取得 LINE 使用者資料
    const profile = await liff.getProfile();

    if (!profile || !profile.userId) {
      throw new Error('LINE Profile 中沒有 userId');
    }

    userId = profile.userId;

    if (!isValidLineUserId(userId)) {
      throw new Error('取得到的 LINE userId 格式無效');
    }

    liffReady = true;

    console.log('LINE userId 取得成功:', userId);

    // 取得 LINE ID 後，載入此使用者專屬資料
    loadLineUserData();

  } catch (error) {
    console.error('LIFF 初始化或取得 LINE ID 失敗:', error);

    userId = '';
    liffReady = false;

    // 不清除已經自動填入的工號、姓名、部門
    // 但不能使用測試 ID 送出正式申請
    alert(
      '目前無法確認您的 LINE 身分。\n\n' +
      '工號、姓名和部門資料仍可填寫，' +
      '但請重新從 LINE 官方帳號開啟借車功能後再送出。'
    );
  }
}

// ==========================================
// 日期下限設為今天
// ==========================================
document.getElementById('borrow-date').min =
  new Date().toISOString().split('T')[0];

// ==========================================
// 乘車人數調整
// ==========================================
function adj(d) {
  pax = Math.max(1, Math.min(15, pax + d));

  document.getElementById('pax-val').textContent = pax;
}

// ==========================================
// 步驟切換
// ==========================================
function goStep(n) {
  if (n > currentStep && !validate(currentStep)) {
    return;
  }

  document
    .getElementById('step' + currentStep)
    .classList.remove('active');

  document
    .getElementById('nav' + currentStep)
    .style.display = 'none';

  currentStep = n;

  document
    .getElementById('step' + n)
    .classList.add('active');

  document
    .getElementById('nav' + n)
    .style.display = 'flex';

  const hints = [
    '填寫基本資料',
    '設定用車時間',
    '說明借用事由'
  ];

  document.getElementById('step-hint').textContent =
    '步驟 ' + n + '/3 — ' + hints[n - 1];

  document.getElementById('progress-bar').style.width =
    (n / 3 * 100) + '%';

  // 進入第三步時，檢查是否需要顯示車牌欄位
  if (n === 3) {
    checkPlateNeeded();
  }
}

// ==========================================
// 檢查用車時間是否在 30 分鐘內
// ==========================================
function checkPlateNeeded() {
  const dateVal =
    document.getElementById('borrow-date').value;

  const timeVal =
    document.getElementById('start-time').value;

  if (!dateVal || !timeVal) {
    return;
  }

  const borrowTime =
    new Date(dateVal + 'T' + timeVal);

  const now = new Date();

  const diffMin =
    (borrowTime - now) / 60000;

  // -5 到 30 分鐘內，視為即時用車
  const isImmediate =
    diffMin > -5 && diffMin < 30;

  document
    .getElementById('plate-section')
    .classList.toggle('show', isImmediate);
}

// ==========================================
// 表單欄位驗證
// ==========================================
function validate(s) {
  if (s === 1) {
    if (!document.getElementById('emp-id').value.trim()) {
      alert('請輸入工號');
      return false;
    }

    if (!document.getElementById('driver').value.trim()) {
      alert('請輸入駕駛人姓名');
      return false;
    }

    if (!document.getElementById('dept').value.trim()) {
      alert('請輸入部門');
      return false;
    }
  }

  if (s === 2) {
    if (!document.getElementById('borrow-date').value) {
      alert('請選擇借用日期');
      return false;
    }

    if (!document.getElementById('start-time').value) {
      alert('請輸入出發時間');
      return false;
    }

    if (!document.getElementById('end-time').value) {
      alert('請輸入預計返回時間');
      return false;
    }
  }

  if (s === 3) {
    const reason =
      document.getElementById('reason-input').value.trim();

    if (!reason) {
      alert('請輸入借用事由');
      return false;
    }

    if (!document.getElementById('location').value.trim()) {
      alert('請輸入目的地');
      return false;
    }
  }

  return true;
}

// ==========================================
// 送出申請
// ==========================================
async function submitForm() {
  // 先確認第三步資料
  if (!validate(3)) {
    return;
  }

  // 送出前強制確認有效 LINE ID
  // 不再使用 U_test_preview
 if (!liffReady || !isValidLineUserId(userId)) {
  const confirmed = confirm(
    '提醒：目前未取得您的 LINE 使用者 ID。\n\n' +
    '仍可送出借車申請，但可能會有以下影響：\n' +
    '1. 管理員可能無法透過 LINE 通知您\n' +
    '2. 派車通知可能無法送達\n' +
    '3. 回報里程按鈕可能無法使用\n\n' +
    '是否仍要送出？'
  );

  if (!confirmed) {
    return;
  }
}

  const submitBtn =
    document.getElementById('submit-btn');

  submitBtn.textContent = '送出中...';
  submitBtn.disabled = true;

  const dateVal =
    document.getElementById('borrow-date').value;

  const timeVal =
    document.getElementById('start-time').value;

  const borrowTime =
    new Date(dateVal + 'T' + timeVal);

  const now = new Date();

  const diffMin =
    (borrowTime - now) / 60000;

  const isImmediate =
    diffMin > -5 && diffMin < 30;

  const finalReason =
    document.getElementById('reason-input').value.trim();

  const plateInput =
    document.getElementById('plate-input').value
      .trim()
      .toUpperCase();

  // 儲存下次自動帶入的資料
  saveUserData();

  const payload = {
    source: 'liff',

    // 真正的 LINE userId
    userId: userId,

    empId:
      document.getElementById('emp-id').value.trim(),

    driver:
      document.getElementById('driver').value.trim(),

    dept:
      document.getElementById('dept').value.trim(),

    borrowDate: dateVal,

    startTime: timeVal,

    endTime:
      document.getElementById('end-time').value,

    pax: pax,

    reason: finalReason,

    location:
      document.getElementById('location').value.trim(),

    note:
      document.getElementById('note').value.trim(),

    plate:
      isImmediate && plateInput
        ? plateInput
        : '',

    status:
      isImmediate && plateInput
        ? '已派車(自行輸入)'
        : '待派車'
  };

  console.log('準備送出的資料:', payload);

  try {
    const response = await fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify(payload)
    });

    // fetch 本身不一定會因為 GAS 回傳錯誤而進入 catch，
    // 因此這裡只要請求完成，就依原本流程顯示成功。
    // 若你的 GAS 有回傳 JSON 狀態，也可以再增加 response.json() 判斷。
    console.log('申請已送出，HTTP 狀態:', response.status);

    // 顯示成功畫面
    document
      .getElementById('step3')
      .classList.remove('active');

    document
      .getElementById('nav3')
      .style.display = 'none';

    document
      .getElementById('success-view')
      .classList.add('show');

    document
      .getElementById('progress-bar')
      .style.width = '100%';

    document
      .getElementById('step-hint')
      .textContent = '申請完成';

    document
      .getElementById('footer')
      .style.display = 'none';

    // 3 秒後關閉 LIFF
    setTimeout(() => {
      try {
        if (typeof liff !== 'undefined' &&
            liff.isInClient()) {
          liff.closeWindow();
        }
      } catch (error) {
        console.log('關閉 LIFF 視窗失敗:', error);
      }
    }, 3000);

  } catch (error) {
    console.error('送出申請失敗:', error);

    alert('送出失敗，請稍後再試。');

    submitBtn.textContent = '送出申請';
    submitBtn.disabled = false;
  }
}

function loginWithLine() {
  const state =
    crypto.randomUUID();

  sessionStorage.setItem(
    'line_login_state',
    state
  );

  const params =
    new URLSearchParams({
      response_type: 'code',
      client_id: LINE_LOGIN_CHANNEL_ID,
      redirect_uri:
        LINE_LOGIN_REDIRECT_URI,
      state: state,
      scope: 'profile openid'
    });

  window.location.href =
    'https://access.line.me/oauth2/v2.1/authorize?' +
    params.toString();
}

async function handleLineLoginCallback() {
  const params =
    new URLSearchParams(
      window.location.search
    );

  const ticket =
    params.get('login_ticket');

  const returnedState =
    params.get('state');

  if (!ticket || !returnedState) {
    return;
  }

  const savedState =
    sessionStorage.getItem(
      'line_login_state'
    );

  if (
    !savedState ||
    savedState !== returnedState
  ) {
    alert(
      '登入驗證失敗，請重新登入。'
    );
    return;
  }

  try {
    const response =
      await fetch(GAS_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8'
        },
        body: JSON.stringify({
          action:
            'exchangeLoginTicket',
          ticket: ticket,
          state: returnedState
        })
      });

    const result =
      await response.json();

    if (!result.ok) {
      throw new Error(
        result.message || '登入失敗'
      );
    }

    sessionStorage.removeItem(
      'line_login_state'
    );

    /*
     * 暫存登入資料。
     * 後續可以改成短期 session。
     */
    sessionStorage.setItem(
      'line_login_user',
      JSON.stringify(result.user)
    );

    /*
     * 清除網址上的 ticket，
     * 避免重新整理時重複使用。
     */
    window.history.replaceState(
      {},
      document.title,
      window.location.pathname
    );

    showLoggedInPage(result.user);

  } catch (error) {
    console.error(
      '登入票券兌換失敗：',
      error
    );

    alert(
      'LINE 登入失敗：' +
      error.message
    );
  }
}

// ==========================================
// 啟動程式
// ==========================================
initLiff();
</script>
